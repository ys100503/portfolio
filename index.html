<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Portfolio</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;

      display: flex;
      justify-content: center;
      align-items: center;

      background:
        radial-gradient(
          circle at 50% 45%,
          rgba(80, 100, 255, 0.12),
          transparent 35%
        ),
        #070707;

      color: white;

      font-family:
        Inter,
        Pretendard,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;

      overflow: hidden;
    }

    .portfolio-coming-soon {
      position: relative;

      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;

      text-align: center;

      padding: 40px 24px;
    }

    h1 {
      font-size: clamp(55px, 8vw, 120px);
      font-weight: 700;

      line-height: 0.95;
      letter-spacing: -0.06em;

      white-space: nowrap;

      background: linear-gradient(
        90deg,
        #ffffff 0%,
        #ffffff 35%,
        #a9b6ff 50%,
        #ffffff 65%,
        #ffffff 100%
      );

      background-size: 200% auto;

      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;

      animation:
        fadeUp 0.9s ease forwards,
        shine 5s linear infinite;
    }

    .description {
      margin-top: 28px;

      /* 요청한 15포인트 */
      font-size: 30pt;

      font-weight: 400;
      letter-spacing: -0.02em;

      color: rgba(255, 255, 255, 0.55);

      animation: fadeUp 1.2s ease forwards;
    }

    .glow {
      position: absolute;

      width: 450px;
      height: 450px;

      top: 50%;
      left: 50%;

      transform: translate(-50%, -50%);

      background: rgba(78, 100, 255, 0.12);

      filter: blur(130px);
      border-radius: 50%;

      z-index: -1;

      animation: glow 4s ease-in-out infinite alternate;
    }

    @keyframes fadeUp {
      from {
        opacity: 0;
        transform: translateY(20px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes shine {
      to {
        background-position: 200% center;
      }
    }

    @keyframes glow {
      from {
        opacity: 0.4;
        transform: translate(-50%, -50%) scale(0.9);
      }

      to {
        opacity: 0.8;
        transform: translate(-50%, -50%) scale(1.15);
      }
    }

    @media (max-width: 900px) {
      h1 {
        white-space: normal;
        font-size: clamp(48px, 12vw, 80px);
      }

      .description {
        font-size: 13pt;
      }
    }
  </style>
</head>

<body>

  <div class="portfolio-coming-soon">

    <div class="glow"></div>

    <h1>Portfolio is Coming Soon</h1>

    <p class="description">
      아직 포트폴리오가 준비되지 않았습니다..
    </p>

  </div>

</body>
</html>
